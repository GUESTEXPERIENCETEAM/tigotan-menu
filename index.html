<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TIGOTAN — Vegan / Gluten Free Menu</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --red: #c91f2b;
  --dark-red: #a91420;
  --cream: #fffaf5;
  --paper: #fffdf9;
  --dark: #202428;
  --grey: #55595d;
}

body {
  min-height: 100vh;
  font-family: "Arial", "Helvetica Neue", sans-serif;
  color: var(--dark);
  background:
    radial-gradient(circle at 8% 50%, rgba(201,31,43,.08), transparent 25%),
    radial-gradient(circle at 92% 50%, rgba(201,31,43,.08), transparent 25%),
    repeating-linear-gradient(
      135deg,
      rgba(201,31,43,.018) 0px,
      rgba(201,31,43,.018) 1px,
      transparent 1px,
      transparent 8px
    ),
    var(--cream);
}

/* PAGE */
.page {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  padding: 42px 22px 125px;
}

/* subtle side ornament */
.side-decoration {
  position: absolute;
  width: 280px;
  height: 520px;
  top: 330px;
  opacity: .11;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse,
      var(--red) 0%,
      rgba(201,31,43,.45) 35%,
      transparent 70%
    );
  filter: blur(25px);
}

.side-decoration.left {
  left: -190px;
  transform: rotate(-12deg);
}

.side-decoration.right {
  right: -190px;
  transform: rotate(12deg);
}

/* CONTENT */
.container {
  position: relative;
  z-index: 2;
  width: min(980px, 100%);
  margin: auto;
}

/* BRAND */
.brand {
  text-align: center;
}

.brand-name {
  color: var(--red);
  font-family: "Arial Black", Impact, sans-serif;
  font-size: clamp(64px, 11vw, 120px);
  font-weight: 900;
  letter-spacing: 7px;
  line-height: .82;
  text-transform: uppercase;
  text-shadow: 1px 1px 0 rgba(120,0,0,.08);
}

.brand-subtitle {
  margin-top: 24px;
  color: var(--red);
  font-family: "Arial Black", Impact, sans-serif;
  font-size: clamp(25px, 4.5vw, 48px);
  font-weight: 900;
  letter-spacing: 1px;
  line-height: 1;
  text-transform: uppercase;
}

.tagline-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 22px;
}

.tagline-line {
  width: 58px;
  height: 4px;
  border-radius: 20px;
  background: var(--red);
}

.tagline {
  color: var(--red);
  font-size: clamp(18px, 3vw, 28px);
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* decorative little strokes */
.strokes {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 24px auto 0;
  max-width: 760px;
}

.stroke-group {
  display: flex;
  gap: 8px;
  align-items: center;
}

.stroke {
  width: 42px;
  height: 6px;
  background: var(--red);
  border-radius: 10px;
  transform: rotate(22deg);
}

.stroke:nth-child(2) {
  width: 25px;
  transform: rotate(-5deg);
}

.stroke:nth-child(3) {
  width: 15px;
  transform: rotate(-22deg);
}

/* LANGUAGE INTRO */
.intro {
  text-align: center;
  margin: 48px auto 30px;
}

.intro h1 {
  font-family: "Arial Black", Impact, sans-serif;
  font-size: clamp(29px, 5vw, 49px);
  line-height: .98;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.intro p {
  margin-top: 18px;
  color: var(--grey);
  font-size: clamp(17px, 2.6vw, 24px);
  line-height: 1.35;
}

/* LANGUAGE GRID */
.languages {
  width: min(850px, 100%);
  margin: 34px auto 0;

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px 18px;
}

.language-card {
  position: relative;
  min-height: 94px;

  display: flex;
  align-items: center;

  padding: 15px 22px;

  background: rgba(255,253,249,.94);
  border: 1.5px solid var(--red);
  border-radius: 13px;

  text-decoration: none;
  color: var(--dark);

  box-shadow:
    0 2px 0 rgba(201,31,43,.05),
    0 8px 22px rgba(50,20,20,.045);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}

.language-card:hover {
  transform: translateY(-3px);
  background: white;
  box-shadow:
    0 5px 0 rgba(201,31,43,.07),
    0 14px 28px rgba(50,20,20,.10);
}

.language-card:active {
  transform: translateY(0);
}

.flag {
  width: 62px;
  height: 42px;
  object-fit: cover;
  flex-shrink: 0;
  border-radius: 4px;
  box-shadow: 0 2px 5px rgba(0,0,0,.16);
}

.language-name {
  flex: 1;
  margin-left: 20px;
  font-size: clamp(20px, 2.7vw, 29px);
  font-weight: 700;
}

.arrow {
  color: var(--red);
  font-size: 39px;
  font-weight: 300;
  line-height: 1;
  margin-left: 12px;
}

/* BOTTOM DECORATION */
.bottom {
  position: absolute;
  z-index: 2;
  left: 0;
  right: 0;
  bottom: 18px;
  height: 65px;
  overflow: hidden;
}

.wave {
  position: relative;
  width: 110%;
  left: -5%;
  height: 25px;
  border-top: 6px solid var(--red);
  border-radius: 50%;
  margin-bottom: 2px;
}

.wave:nth-child(2) {
  transform: translateY(2px);
}

/* small red dots / design marks */
.bottom::before {
  content: "•   •   •   •   •   •   •   •   •   •   •";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 43px;
  white-space: nowrap;
  color: var(--red);
  font-size: 11px;
  letter-spacing: 15px;
  opacity: .7;
}

/* MOBILE */
@media (max-width: 700px) {

  .page {
    padding: 34px 15px 115px;
  }

  .brand-name {
    letter-spacing: 3px;
  }

  .brand-subtitle {
    margin-top: 18px;
    line-height: 1.05;
  }

  .tagline-wrap {
    gap: 10px;
    margin-top: 17px;
  }

  .tagline-line {
    width: 30px;
    height: 3px;
  }

  .strokes {
    display: none;
  }

  .intro {
    margin-top: 38px;
  }

  .languages {
    grid-template-columns: 1fr;
    gap: 11px;
    margin-top: 27px;
  }

  .language-card {
    min-height: 76px;
    padding: 11px 16px;
  }

  .flag {
    width: 55px;
    height: 37px;
  }

  .language-name {
    margin-left: 16px;
    font-size: 22px;
  }

  .arrow {
    font-size: 32px;
  }
}

@media (max-width: 390px) {

  .brand-name {
    font-size: 54px;
  }

  .brand-subtitle {
    font-size: 23px;
  }

  .intro h1 {
    font-size: 27px;
  }

  .language-name {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="side-decoration left"></div>
  <div class="side-decoration right"></div>

  <div class="container">

    <!-- TIGOTAN BRAND -->
    <header class="brand">

      <div class="brand-name">
        TIGOTAN
      </div>

      <div class="brand-subtitle">
        VEGAN / GLUTEN FREE MENU
      </div>

      <div class="tagline-wrap">
        <div class="tagline-line"></div>

        <div class="tagline">
          YOU DINE, YOUR WAY
        </div>

        <div class="tagline-line"></div>
      </div>

      <div class="strokes">
        <div class="stroke-group">
          <div class="stroke"></div>
          <div class="stroke"></div>
          <div class="stroke"></div>
        </div>

        <div class="stroke-group">
          <div class="stroke"></div>
          <div class="stroke"></div>
          <div class="stroke"></div>
        </div>
      </div>

    </header>


    <!-- LANGUAGE INTRO -->
    <section class="intro">

      <h1>
        CHOOSE YOUR<br>
        PREFERRED LANGUAGE
      </h1>

      <p>
        Discover our Vegan &amp; Gluten Free Menu<br>
        in your preferred language.
      </p>

    </section>


    <!-- LANGUAGES -->
    <section class="languages">

      <a class="language-card" href="./en/menu.pdf">
        <img class="flag" src="./gb.svg" alt="English flag">
        <span class="language-name">English</span>
        <span class="arrow">→</span>
      </a>

      <a class="language-card" href="./es/menu.pdf">
        <img class="flag" src="./es.svg" alt="Spanish flag">
        <span class="language-name">Español</span>
        <span class="arrow">→</span>
      </a>

      <a class="language-card" href="./fr/menu.pdf">
        <img class="flag" src="./fr.svg" alt="French flag">
        <span class="language-name">Français</span>
        <span class="arrow">→</span>
      </a>

      <a class="language-card" href="./it/menu.pdf">
        <img class="flag" src="./it.svg" alt="Italian flag">
        <span class="language-name">Italiano</span>
        <span class="arrow">→</span>
      </a>

      <a class="language-card" href="./de/menu.pdf">
        <img class="flag" src="./de.svg" alt="German flag">
        <span class="language-name">Deutsch</span>
        <span class="arrow">→</span>
      </a>

      <a class="language-card" href="./nl/menu.pdf">
        <img class="flag" src="./nl.svg" alt="Dutch flag">
        <span class="language-name">Nederlands</span>
        <span class="arrow">→</span>
      </a>

      <a class="language-card" href="./is/menu.pdf">
        <img class="flag" src="./is.svg" alt="Icelandic flag">
        <span class="language-name">Íslenska</span>
        <span class="arrow">→</span>
      </a>

      <a class="language-card" href="./sv/menu.pdf">
        <img class="flag" src="./se.svg" alt="Swedish flag">
        <span class="language-name">Svenska</span>
        <span class="arrow">→</span>
      </a>

    </section>

  </div>


  <!-- BOTTOM WAVES -->
  <div class="bottom">
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

</div>

</body>
</html>
