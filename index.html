<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TIGOTAN – Vegan / Gluten Free Menu</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        background:
            radial-gradient(circle at 10% 20%, rgba(185, 32, 40, 0.035) 0 1px, transparent 1.5px),
            radial-gradient(circle at 90% 70%, rgba(185, 32, 40, 0.035) 0 1px, transparent 1.5px),
            #fffaf4;
        background-size: 9px 9px, 11px 11px;
        color: #15191c;
        font-family: Georgia, "Times New Roman", serif;
        overflow-x: hidden;
    }

    /* Soft decorative texture on both sides */
    body::before,
    body::after {
        content: "";
        position: fixed;
        top: 22%;
        bottom: 8%;
        width: 18%;
        pointer-events: none;
        opacity: 0.28;
        z-index: 0;
        background:
            radial-gradient(
                ellipse at center,
                rgba(214, 45, 50, 0.20) 0%,
                rgba(214, 45, 50, 0.12) 25%,
                rgba(214, 45, 50, 0.055) 48%,
                transparent 72%
            );
        filter: blur(1px);
    }

    body::before {
        left: -5%;
        transform: rotate(-8deg);
    }

    body::after {
        right: -5%;
        transform: rotate(8deg);
    }

    .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        padding: 12px 20px 105px;
        text-align: center;
    }

    /* ---------------- HEADER ---------------- */

    .brand {
        margin: 0;
        color: #c91f2a;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(62px, 8vw, 108px);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: 2px;
    }

    .subtitle {
        margin: 18px 0 0;
        color: #c91f2a;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(28px, 3.2vw, 46px);
        font-weight: 800;
        letter-spacing: 1px;
        line-height: 1.05;
    }

    .tagline {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin: 24px auto 0;
        color: #c91f2a;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(19px, 2vw, 29px);
        font-weight: 800;
        letter-spacing: 2px;
    }

    .tagline::before,
    .tagline::after {
        content: "";
        width: 55px;
        height: 3px;
        background: #c91f2a;
        display: block;
    }

    /* Decorative hand-drawn style marks */
    .decor {
        width: 100%;
        max-width: 760px;
        height: 58px;
        margin: 8px auto 0;
        position: relative;
    }

    .decor span {
        position: absolute;
        width: 30px;
        height: 4px;
        background: #c91f2a;
        border-radius: 50%;
    }

    .decor .l1 {
        left: 17%;
        top: 23px;
        transform: rotate(28deg);
    }

    .decor .l2 {
        left: 20%;
        top: 33px;
        transform: rotate(-5deg);
    }

    .decor .l3 {
        left: 23%;
        top: 25px;
        transform: rotate(-28deg);
    }

    .decor .r1 {
        right: 17%;
        top: 23px;
        transform: rotate(-28deg);
    }

    .decor .r2 {
        right: 20%;
        top: 33px;
        transform: rotate(5deg);
    }

    .decor .r3 {
        right: 23%;
        top: 25px;
        transform: rotate(28deg);
    }

    /* ---------------- LANGUAGE INTRO ---------------- */

    .language-heading {
        margin: 0 auto;
        max-width: 760px;
    }

    .language-heading h2 {
        margin: 0;
        color: #111820;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(34px, 4vw, 57px);
        font-weight: 900;
        line-height: 0.98;
        letter-spacing: -1.5px;
        text-transform: uppercase;
    }

    .language-heading p {
        margin: 22px 0 0;
        color: #34383d;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(18px, 1.8vw, 25px);
        line-height: 1.35;
    }

    /* ---------------- LANGUAGE BUTTONS ---------------- */

    .languages {
        width: min(850px, 94vw);
        margin: 34px auto 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 14px;
    }

    .language {
        min-height: 72px;
        padding: 10px 18px;
        display: flex;
        align-items: center;
        text-decoration: none;
        color: #111820;
        background: rgba(255, 252, 247, 0.82);
        border: 1.5px solid #d9272e;
        border-radius: 12px;
        transition:
            transform 0.15s ease,
            background 0.15s ease,
            box-shadow 0.15s ease;
    }

    .language:hover {
        transform: translateY(-2px);
        background: #ffffff;
        box-shadow: 0 5px 15px rgba(190, 30, 40, 0.12);
    }

    .flag {
        width: 48px;
        min-width: 48px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
        font-size: 35px;
        line-height: 1;
    }

    .language-name {
        margin-left: 16px;
        flex: 1;
        text-align: left;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(20px, 2vw, 28px);
        font-weight: 700;
        white-space: nowrap;
    }

    .arrow {
        color: #c91f2a;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 32px;
        font-weight: 300;
        line-height: 1;
        margin-left: 10px;
    }

    /* ---------------- BOTTOM WAVES ---------------- */

    .waves {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        height: 70px;
        overflow: hidden;
        pointer-events: none;
    }

    .wave {
        position: absolute;
        left: -3%;
        width: 106%;
        height: 27px;
    }

    .wave::before {
        content: "";
        position: absolute;
        left: -20px;
        right: -20px;
        top: 8px;
        height: 14px;
        border-top: 7px solid #d3262d;
        border-radius: 50%;
        transform: rotate(0deg);
    }

    .wave.one {
        top: 0;
    }

    .wave.two {
        top: 28px;
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 700px) {

        .page {
            padding: 20px 14px 105px;
        }

        .brand {
            font-size: clamp(55px, 17vw, 85px);
        }

        .subtitle {
            font-size: clamp(22px, 6vw, 34px);
            line-height: 1.1;
        }

        .tagline {
            font-size: 17px;
            gap: 10px;
        }

        .tagline::before,
        .tagline::after {
            width: 35px;
        }

        .decor {
            height: 42px;
        }

        .language-heading h2 {
            font-size: 32px;
        }

        .language-heading p {
            font-size: 17px;
            margin-top: 14px;
        }

        .languages {
            grid-template-columns: 1fr;
            width: min(560px, 94vw);
            gap: 10px;
            margin-top: 25px;
        }

        .language {
            min-height: 67px;
        }

        .flag {
            width: 43px;
            min-width: 43px;
            font-size: 31px;
        }

        .language-name {
            font-size: 23px;
        }

        .arrow {
            font-size: 28px;
        }

        body::before,
        body::after {
            width: 24%;
            opacity: 0.2;
        }
    }
</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->
    <h1 class="brand">TIGOTAN</h1>

    <div class="subtitle">
        VEGAN / GLUTEN FREE MENU
    </div>

    <div class="tagline">
        YOU DINE, YOUR WAY
    </div>

    <div class="decor" aria-hidden="true">
        <span class="l1"></span>
        <span class="l2"></span>
        <span class="l3"></span>
        <span class="r1"></span>
        <span class="r2"></span>
        <span class="r3"></span>
    </div>

    <!-- LANGUAGE TITLE -->
    <section class="language-heading">
        <h2>
            CHOOSE YOUR<br>
            PREFERRED LANGUAGE
        </h2>

        <p>
            Discover our Vegan &amp; Gluten Free Menu<br>
            in your preferred language.
        </p>
    </section>

    <!-- LANGUAGE LINKS -->
    <nav class="languages" aria-label="Menu languages">

        <a class="language" href="en/menu.pdf">
            <span class="flag">🇬🇧</span>
            <span class="language-name">English</span>
            <span class="arrow">→</span>
        </a>

        <a class="language" href="es/menu.pdf">
            <span class="flag">🇪🇸</span>
            <span class="language-name">Español</span>
            <span class="arrow">→</span>
        </a>

        <a class="language" href="fr/menu.pdf">
            <span class="flag">🇫🇷</span>
            <span class="language-name">Français</span>
            <span class="arrow">→</span>
        </a>

        <a class="language" href="it/menu.pdf">
            <span class="flag">🇮🇹</span>
            <span class="language-name">Italiano</span>
            <span class="arrow">→</span>
        </a>

        <a class="language" href="de/menu.pdf">
            <span class="flag">🇩🇪</span>
            <span class="language-name">Deutsch</span>
            <span class="arrow">→</span>
        </a>

        <a class="language" href="nl/menu.pdf">
            <span class="flag">🇳🇱</span>
            <span class="language-name">Nederlands</span>
            <span class="arrow">→</span>
        </a>

        <a class="language" href="is/menu.pdf">
            <span class="flag">🇮🇸</span>
            <span class="language-name">Íslenska</span>
            <span class="arrow">→</span>
        </a>

        <a class="language" href="sv/menu.pdf">
            <span class="flag">🇸🇪</span>
            <span class="language-name">Svenska</span>
            <span class="arrow">→</span>
        </a>

    </nav>

    <!-- BOTTOM DECORATION -->
    <div class="waves" aria-hidden="true">
        <div class="wave one"></div>
        <div class="wave two"></div>
    </div>

</div>

</body>
</html>
