<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TIGOTAN — Vegan / Gluten Free Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(193, 42, 55, 0.025) 0,
                    transparent 28%
                ),
                radial-gradient(
                    circle at 80% 75%,
                    rgba(193, 42, 55, 0.02) 0,
                    transparent 30%
                ),
                #f8f1e8;

            color: #241d19;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }

        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 42px 20px 0;
        }

        /* =========================
           HEADER
        ========================= */

        .hero {
            width: 100%;
            max-width: 920px;

            text-align: center;

            padding: 10px 10px 34px;
        }

        .hero h1 {
            margin: 0;

            color: #c3263b;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(48px, 8vw, 78px);
            font-weight: 700;

            line-height: 0.95;
            letter-spacing: 5px;
        }

        .hero-subtitle {
            margin: 17px 0 0;

            color: #29211d;

            font-size: clamp(20px, 3vw, 29px);
            font-weight: 700;

            line-height: 1.1;
            letter-spacing: 2px;

            text-transform: uppercase;
        }

        /* =========================
           DECORATIVE LINE
        ========================= */

        .top-decoration {
            width: 100%;
            max-width: 920px;

            height: 10px;

            position: relative;

            margin-bottom: 24px;
        }

        .top-decoration::before {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            top: 4px;

            height: 1px;

            background: #c3263b;
        }

        .top-decoration::after {
            content: "◆";

            position: absolute;

            left: 50%;
            top: -5px;

            transform: translateX(-50%);

            color: #c3263b;

            font-size: 12px;

            background: #f8f1e8;

            padding: 0 12px;
        }

        /* =========================
           LANGUAGES
        ========================= */

        .languages {
            width: 100%;
            max-width: 920px;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 15px 20px;
        }

        .language-card {
            min-height: 78px;

            display: flex;
            align-items: center;

            padding: 14px 20px;

            background: #fffdf9;

            border: 1px solid #c3263b;

            border-radius: 2px;

            text-decoration: none;

            color: #241d19;

            transition:
                background 0.18s ease,
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .language-card:hover {
            background: #fff8f2;

            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(100, 35, 35, 0.10);
        }

        .language-card:active {
            transform: translateY(0);
        }

        .flag {
            width: 43px;
            height: 30px;

            object-fit: contain;

            flex-shrink: 0;

            margin-right: 19px;
        }

        .language-name {
            font-size: 21px;

            font-weight: 700;

            letter-spacing: 0.2px;
        }

        .arrow {
            margin-left: auto;

            color: #c3263b;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 27px;
            font-weight: 300;

            line-height: 1;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            width: 100%;
            max-width: 920px;

            margin-top: 48px;

            padding-bottom: 28px;

            text-align: center;
        }

        .footer-decoration {
            width: 100%;

            height: 27px;

            position: relative;

            margin-bottom: 17px;

            overflow: hidden;
        }

        .footer-decoration::before {
            content: "";

            position: absolute;

            left: -5%;
            width: 110%;

            top: 5px;

            height: 15px;

            border-top: 2px solid #c3263b;

            border-radius: 50%;

            transform: rotate(1deg);
        }

        .footer-decoration::after {
            content: "";

            position: absolute;

            left: -5%;
            width: 110%;

            top: 13px;

            height: 15px;

            border-top: 1px solid #c3263b;

            border-radius: 50%;

            transform: rotate(-1deg);
        }

        .tagline {
            color: #c3263b;

            font-size: clamp(17px, 2.5vw, 23px);

            font-weight: 700;

            letter-spacing: 3px;

            line-height: 1.2;

            text-transform: uppercase;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .page {
                padding: 27px 14px 0;
            }

            .hero {
                padding-bottom: 27px;
            }

            .hero h1 {
                font-size: 48px;
                letter-spacing: 3px;
            }

            .hero-subtitle {
                margin-top: 13px;

                font-size: 19px;
                letter-spacing: 1px;
            }

            .top-decoration {
                margin-bottom: 18px;
            }

            .languages {
                grid-template-columns: 1fr;

                gap: 10px;
            }

            .language-card {
                min-height: 68px;

                padding: 11px 16px;
            }

            .flag {
                width: 39px;
                height: 28px;

                margin-right: 16px;
            }

            .language-name {
                font-size: 20px;
            }

            .arrow {
                font-size: 26px;
            }

            .footer {
                margin-top: 38px;

                padding-bottom: 20px;
            }

            .tagline {
                font-size: 16px;

                letter-spacing: 2.2px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <header class="hero">

            <h1>TIGOTAN</h1>

            <div class="hero-subtitle">
                VEGAN / GLUTEN FREE MENU
            </div>

        </header>


        <div
            class="top-decoration"
            aria-hidden="true"
        ></div>


        <section
            class="languages"
            aria-label="Choose your language"
        >

            <a
                class="language-card"
                href="en/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="gb.svg"
                    alt="English"
                >

                <span class="language-name">
                    English
                </span>

                <span class="arrow">
                    →
                </span>
            </a>


            <a
                class="language-card"
                href="es/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="es.svg"
                    alt="Español"
                >

                <span class="language-name">
                    Español
                </span>

                <span class="arrow">
                    →
                </span>
            </a>


            <a
                class="language-card"
                href="fr/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="fr.svg"
                    alt="Français"
                >

                <span class="language-name">
                    Français
                </span>

                <span class="arrow">
                    →
                </span>
            </a>


            <a
                class="language-card"
                href="it/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="it.svg"
                    alt="Italiano"
                >

                <span class="language-name">
                    Italiano
                </span>

                <span class="arrow">
                    →
                </span>
            </a>


            <a
                class="language-card"
                href="de/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="de.svg"
                    alt="Deutsch"
                >

                <span class="language-name">
                    Deutsch
                </span>

                <span class="arrow">
                    →
                </span>
            </a>


            <a
                class="language-card"
                href="nl/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="nl.svg"
                    alt="Nederlands"
                >

                <span class="language-name">
                    Nederlands
                </span>

                <span class="arrow">
                    →
                </span>
            </a>


            <a
                class="language-card"
                href="is/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="is.svg"
                    alt="Íslenska"
                >

                <span class="language-name">
                    Íslenska
                </span>

                <span class="arrow">
                    →
                </span>
            </a>


            <a
                class="language-card"
                href="sv/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="se.svg"
                    alt="Svenska"
                >

                <span class="language-name">
                    Svenska
                </span>

                <span class="arrow">
                    →
                </span>
            </a>

        </section>


        <footer class="footer">

            <div
                class="footer-decoration"
                aria-hidden="true"
            ></div>

            <div class="tagline">
                YOU DINE, YOUR WAY
            </div>

        </footer>

    </main>

</body>
</html>
