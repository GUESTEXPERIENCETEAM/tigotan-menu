<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TIGOTAN — Vegan / Gluten Free Menu</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        background:
            linear-gradient(135deg, rgba(180, 30, 35, 0.025) 25%, transparent 25%) 0 0 / 8px 8px,
            linear-gradient(315deg, rgba(180, 30, 35, 0.018) 25%, transparent 25%) 0 0 / 8px 8px,
            #fbf5ed;
        color: #171717;
        font-family: Georgia, "Times New Roman", serif;
        overflow-x: hidden;
    }

    .page {
        min-height: 100vh;
        position: relative;
        padding: 34px 28px 105px;
        overflow: hidden;
    }

    /* subtle decorative side texture */
    .page::before,
    .page::after {
        content: "";
        position: absolute;
        top: 390px;
        width: 230px;
        height: 560px;
        opacity: 0.16;
        pointer-events: none;
        background:
            radial-gradient(circle at 30% 30%, #d3232a 0 1px, transparent 2px),
            radial-gradient(circle at 70% 60%, #d3232a 0 1px, transparent 2px),
            radial-gradient(circle at 45% 80%, #d3232a 0 1px, transparent 2px);
        background-size: 15px 15px, 19px 19px, 13px 13px;
        filter: blur(0.4px);
    }

    .page::before {
        left: -105px;
        transform: rotate(10deg);
    }

    .page::after {
        right: -105px;
        transform: rotate(-10deg);
    }

    .content {
        position: relative;
        z-index: 2;
        max-width: 1080px;
        margin: 0 auto;
    }

    /* HEADER */

    .brand {
        text-align: center;
        margin-bottom: 4px;
    }

    .brand h1 {
        margin: 0;
        color: #c91f28;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(64px, 9vw, 126px);
        line-height: 0.9;
        letter-spacing: 7px;
        font-weight: 900;
        text-transform: uppercase;
    }

    .subtitle {
        margin-top: 20px;
        text-align: center;
        color: #c91f28;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(26px, 3.4vw, 48px);
        line-height: 1.05;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    /* YOU DINE YOUR WAY */

    .slogan-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        margin: 22px auto 0;
    }

    .slogan-line {
        width: 65px;
        height: 3px;
        background: #c91f28;
    }

    .slogan {
        color: #c91f28;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(18px, 2vw, 28px);
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        white-space: nowrap;
    }

    /* HAND-DRAWN DETAILS */

    .decor {
        width: 100%;
        max-width: 700px;
        margin: 16px auto 0;
        display: flex;
        justify-content: space-between;
        padding: 0 35px;
    }

    .marks {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 40px;
    }

    .marks span {
        display: block;
        height: 4px;
        background: #c91f28;
        border-radius: 5px;
    }

    .marks.left span:nth-child(1) {
        width: 34px;
        transform: rotate(25deg);
    }

    .marks.left span:nth-child(2) {
        width: 24px;
        transform: rotate(-5deg);
    }

    .marks.left span:nth-child(3) {
        width: 12px;
        transform: rotate(-25deg);
    }

    .marks.right {
        transform: scaleX(-1);
    }

    /* LANGUAGE INTRO */

    .intro {
        text-align: center;
        margin: 30px auto 30px;
    }

    .intro h2 {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(30px, 4vw, 52px);
        line-height: 0.98;
        font-weight: 900;
        letter-spacing: -1px;
        text-transform: uppercase;
        color: #171717;
    }

    .intro p {
        margin: 18px auto 0;
        max-width: 650px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(17px, 2vw, 24px);
        line-height: 1.45;
        color: #3e3e3e;
    }

    /* LANGUAGE GRID */

    .languages {
        width: min(100%, 900px);
        margin: 28px auto 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 13px 16px;
    }

    .language {
        display: flex;
        align-items: center;
        min-height: 84px;
        padding: 12px 22px;
        text-decoration: none;
        color: #161616;
        background: rgba(255, 252, 247, 0.82);
        border: 1.5px solid #d9232e;
        border-radius: 13px;
        box-shadow: 0 2px 7px rgba(120, 30, 30, 0.035);
        transition:
            transform 0.18s ease,
            background 0.18s ease,
            box-shadow 0.18s ease;
    }

    .language:hover {
        transform: translateY(-2px);
        background: #fffdfa;
        box-shadow: 0 7px 18px rgba(120, 30, 30, 0.10);
    }

    .language:active {
        transform: translateY(0);
    }

    .flag {
        width: 54px;
        height: 36px;
        object-fit: cover;
        flex: 0 0 54px;
        border-radius: 3px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    }

    .language-name {
        margin-left: 18px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(20px, 2.5vw, 29px);
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
    }

    .arrow {
        margin-left: auto;
        color: #c91f28;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 32px;
        font-weight: 300;
        line-height: 1;
        transition: transform 0.18s ease;
    }

    .language:hover .arrow {
        transform: translateX(5px);
    }

    /* BOTTOM DECORATION */

    .bottom {
        position: absolute;
        z-index: 3;
        left: 0;
        right: 0;
        bottom: 18px;
        height: 58px;
        overflow: hidden;
    }

    .wave {
        position: absolute;
        left: -2%;
        width: 104%;
        height: 20px;
        border-top: 6px solid #c91f28;
        border-radius: 50%;
        transform: rotate(0deg);
    }

    .wave.one {
        top: 8px;
    }

    .wave.two {
        top: 31px;
    }

    /* MOBILE */

    @media (max-width: 700px) {
        .page {
            padding: 25px 16px 100px;
        }

        .brand h1 {
            letter-spacing: 4px;
        }

        .subtitle {
            font-size: 25px;
            line-height: 1.15;
            margin-top: 14px;
        }

        .slogan-wrap {
            gap: 10px;
        }

        .slogan-line {
            width: 32px;
        }

        .slogan {
            font-size: 15px;
            letter-spacing: 1px;
        }

        .decor {
            padding: 0 5px;
        }

        .intro {
            margin-top: 25px;
        }

        .intro h2 {
            font-size: 29px;
        }

        .intro p {
            font-size: 16px;
        }

        .languages {
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 24px;
        }

        .language {
            min-height: 72px;
            padding: 10px 16px;
        }

        .flag {
            width: 48px;
            height: 32px;
            flex-basis: 48px;
        }

        .language-name {
            margin-left: 15px;
            font-size: 22px;
        }

        .arrow {
            font-size: 28px;
        }
    }

    @media (min-width: 701px) {
        .language:nth-child(1) { order: 1; }
        .language:nth-child(2) { order: 2; }
        .language:nth-child(3) { order: 3; }
        .language:nth-child(4) { order: 4; }
        .language:nth-child(5) { order: 5; }
        .language:nth-child(6) { order: 6; }
        .language:nth-child(7) { order: 7; }
        .language:nth-child(8) { order: 8; }
    }
</style>
</head>

<body>

<div class="page">

    <main class="content">

        <!-- TIGOTAN -->
        <header class="brand">
            <h1>TIGOTAN</h1>

            <div class="subtitle">
                VEGAN / GLUTEN FREE MENU
            </div>

            <div class="slogan-wrap">
                <div class="slogan-line"></div>
                <div class="slogan">YOU DINE, YOUR WAY</div>
                <div class="slogan-line"></div>
            </div>

            <div class="decor">
                <div class="marks left">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="marks right">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </header>


        <!-- INTRO -->
        <section class="intro">
            <h2>
                CHOOSE YOUR<br>
                PREFERRED LANGUAGE
            </h2>

            <p>
                Discover our Vegan &amp; Gluten Free Menu<br>
                in your preferred language.
            </p>
        </section>


        <!-- LANGUAGES -->
        <section class="languages">

            <a class="language" href="en/menu.pdf" target="_blank">
                <img class="flag" src="gb.svg" alt="English">
                <span class="language-name">English</span>
                <span class="arrow">→</span>
            </a>

            <a class="language" href="es/menu.pdf" target="_blank">
                <img class="flag" src="es.svg" alt="Español">
                <span class="language-name">Español</span>
                <span class="arrow">→</span>
            </a>

            <a class="language" href="fr/menu.pdf" target="_blank">
                <img class="flag" src="fr.svg" alt="Français">
                <span class="language-name">Français</span>
                <span class="arrow">→</span>
            </a>

            <a class="language" href="it/menu.pdf" target="_blank">
                <img class="flag" src="it.svg" alt="Italiano">
                <span class="language-name">Italiano</span>
                <span class="arrow">→</span>
            </a>

            <a class="language" href="de/menu.pdf" target="_blank">
                <img class="flag" src="de.svg" alt="Deutsch">
                <span class="language-name">Deutsch</span>
                <span class="arrow">→</span>
            </a>

            <a class="language" href="nl/menu.pdf" target="_blank">
                <img class="flag" src="nl.svg" alt="Nederlands">
                <span class="language-name">Nederlands</span>
                <span class="arrow">→</span>
            </a>

            <a class="language" href="is/menu.pdf" target="_blank">
                <img class="flag" src="is.svg" alt="Íslenska">
                <span class="language-name">Íslenska</span>
                <span class="arrow">→</span>
            </a>

            <a class="language" href="sv/menu.pdf" target="_blank">
                <img class="flag" src="se.svg" alt="Svenska">
                <span class="language-name">Svenska</span>
                <span class="arrow">→</span>
            </a>

        </section>

    </main>


    <!-- BOTTOM TIGOTAN DETAIL -->
    <div class="bottom">
        <div class="wave one"></div>
        <div class="wave two"></div>
    </div>

</div>

</body>
</html>
