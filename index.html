<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TIGOTAN — Vegan / Gluten Free Menu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 0% 65%, rgba(220, 55, 55, 0.07), transparent 28%),
        radial-gradient(circle at 100% 65%, rgba(220, 55, 55, 0.07), transparent 28%),
        #fffaf6;
      color: #202428;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      position: relative;
      padding: 55px 24px 125px;
      overflow: hidden;
    }

    /* Decorative side texture */
    .page::before,
    .page::after {
      content: "";
      position: absolute;
      top: 380px;
      width: 250px;
      height: 650px;
      opacity: 0.13;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(205, 35, 45, 0.55) 0%,
          rgba(205, 35, 45, 0.18) 38%,
          transparent 72%
        );
      filter: blur(18px);
    }

    .page::before {
      left: -120px;
      transform: rotate(8deg);
    }

    .page::after {
      right: -120px;
      transform: rotate(-8deg);
    }

    .content {
      width: min(100%, 1000px);
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* =========================
       HEADER
       ========================= */

    .brand {
      text-align: center;
      margin-bottom: 10px;
    }

    .brand-title {
      font-size: clamp(58px, 10vw, 112px);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: 5px;
      color: #c82027;
      text-transform: uppercase;
    }

    .menu-title {
      margin-top: 22px;
      font-size: clamp(27px, 5vw, 52px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 1px;
      color: #c82027;
      text-transform: uppercase;
    }

    .tagline {
      margin-top: 25px;
      color: #c82027;
      font-size: clamp(18px, 3vw, 30px);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .tagline-line {
      width: 90px;
      height: 4px;
      background: #c82027;
      margin: 24px auto 0;
      border-radius: 10px;
    }

    /* =========================
       LANGUAGE INTRO
       ========================= */

    .language-intro {
      text-align: center;
      margin: 38px auto 30px;
    }

    .language-intro h1 {
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.02;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #202428;
    }

    .language-intro p {
      margin-top: 20px;
      font-size: clamp(17px, 2.5vw, 25px);
      line-height: 1.4;
      color: #45494d;
    }

    /* =========================
       LANGUAGE GRID
       ========================= */

    .languages {
      width: min(100%, 760px);
      margin: 30px auto 0;

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 20px;
    }

    .language-card {
      min-height: 92px;
      padding: 16px 24px;

      display: flex;
      align-items: center;
      gap: 24px;

      background: rgba(255, 253, 250, 0.94);
      border: 1.5px solid #d22b31;
      border-radius: 12px;

      text-decoration: none;
      color: #202428;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .language-card:hover {
      transform: translateY(-2px);
      background: #ffffff;
      box-shadow: 0 7px 20px rgba(190, 25, 35, 0.12);
    }

    .language-card:active {
      transform: translateY(0);
    }

    .flag {
      width: 64px;
      height: 44px;
      object-fit: cover;
      flex-shrink: 0;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      background: #eee;
    }

    .language-name {
      flex: 1;
      font-size: clamp(21px, 3vw, 31px);
      font-weight: 700;
      line-height: 1.1;
    }

    .arrow {
      color: #c82027;
      font-size: 38px;
      font-weight: 300;
      line-height: 1;
      flex-shrink: 0;
    }

    /* =========================
       FOOTER DECORATION
       ========================= */

    .footer-decoration {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 25px;
      z-index: 1;
      overflow: hidden;
      height: 75px;
    }

    .wave {
      width: 110%;
      margin-left: -5%;
      height: 25px;
      border-top: 7px solid #c82027;
      border-radius: 50%;
      opacity: 0.85;
      transform: rotate(0deg);
    }

    .wave + .wave {
      margin-top: 2px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {
      .page {
        padding: 38px 16px 115px;
      }

      .brand-title {
        letter-spacing: 2px;
      }

      .menu-title {
        line-height: 1.05;
        margin-top: 16px;
      }

      .tagline {
        margin-top: 18px;
        letter-spacing: 1px;
      }

      .language-intro {
        margin-top: 32px;
      }

      .languages {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .language-card {
        min-height: 78px;
        padding: 12px 17px;
        gap: 18px;
      }

      .flag {
        width: 56px;
        height: 38px;
      }

      .language-name {
        font-size: 23px;
      }

      .arrow {
        font-size: 32px;
      }
    }

    @media (max-width: 400px) {
      .brand-title {
        font-size: 52px;
      }

      .menu-title {
        font-size: 25px;
      }

      .language-intro h1 {
        font-size: 28px;
      }

      .language-card {
        gap: 14px;
      }

      .flag {
        width: 50px;
        height: 34px;
      }

      .language-name {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="content">

      <!-- BRAND -->
      <header class="brand">

        <div class="brand-title">
          TIGOTAN
        </div>

        <div class="menu-title">
          VEGAN / GLUTEN FREE MENU
        </div>

        <div class="tagline">
          YOU DINE, YOUR WAY
        </div>

        <div class="tagline-line"></div>

      </header>


      <!-- LANGUAGE INTRO -->
      <section class="language-intro">

        <h1>
          CHOOSE YOUR<br>
          PREFERRED LANGUAGE
        </h1>

        <p>
          Discover our Vegan &amp; Gluten Free Menu<br>
          in your preferred language.
        </p>

      </section>


      <!-- LANGUAGES -->
      <section class="languages">

        <!-- ENGLISH -->
        <a class="language-card" href="./pdf/en/menu.pdf" target="_blank">
          <img class="flag" src="./gb.svg" alt="English">
          <span class="language-name">English</span>
          <span class="arrow">→</span>
        </a>

        <!-- ESPAÑOL -->
        <a class="language-card" href="./pdf/es/menu.pdf" target="_blank">
          <img class="flag" src="./es.svg" alt="Español">
          <span class="language-name">Español</span>
          <span class="arrow">→</span>
        </a>

        <!-- FRANÇAIS -->
        <a class="language-card" href="./pdf/fr/menu.pdf" target="_blank">
          <img class="flag" src="./fr.svg" alt="Français">
          <span class="language-name">Français</span>
          <span class="arrow">→</span>
        </a>

        <!-- ITALIANO -->
        <a class="language-card" href="./pdf/it/menu.pdf" target="_blank">
          <img class="flag" src="./it.svg" alt="Italiano">
          <span class="language-name">Italiano</span>
          <span class="arrow">→</span>
        </a>

        <!-- DEUTSCH -->
        <a class="language-card" href="./pdf/de/menu.pdf" target="_blank">
          <img class="flag" src="./de.svg" alt="Deutsch">
          <span class="language-name">Deutsch</span>
          <span class="arrow">→</span>
        </a>

        <!-- NEDERLANDS -->
        <a class="language-card" href="./pdf/nl/menu.pdf" target="_blank">
          <img class="flag" src="./nl.svg" alt="Nederlands">
          <span class="language-name">Nederlands</span>
          <span class="arrow">→</span>
        </a>

        <!-- ÍSLENSKA -->
        <a class="language-card" href="./pdf/is/menu.pdf" target="_blank">
          <img class="flag" src="./is.svg" alt="Íslenska">
          <span class="language-name">Íslenska</span>
          <span class="arrow">→</span>
        </a>

        <!-- SVENSKA -->
        <a class="language-card" href="./pdf/sv/menu.pdf" target="_blank">
          <img class="flag" src="./se.svg" alt="Svenska">
          <span class="language-name">Svenska</span>
          <span class="arrow">→</span>
        </a>

      </section>

    </div>


    <!-- BOTTOM DECORATION -->
    <div class="footer-decoration">
      <div class="wave"></div>
      <div class="wave"></div>
    </div>

  </main>

</body>
</html>
