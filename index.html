<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tigotan | Vegan / Gluten Free Menu</title>

    <meta
        name="description"
        content="Tigotan Vegan / Gluten Free Menu. Choose your preferred language."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #fffdf8;
            color: #151515;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 38px 20px 0;
        }

        /* =========================
           HEADER
        ========================= */

        .hero {
            width: 100%;
            max-width: 900px;
            text-align: center;
            padding: 8px 10px 34px;
        }

        .hero h1 {
            margin: 0;
            color: #c8102e;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 7vw, 72px);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: 3px;
        }

        .hero p {
            margin: 18px 0 0;
            color: #171717;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(20px, 3vw, 30px);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* =========================
           LANGUAGE BUTTONS
        ========================= */

        .languages {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 18px;
        }

        .language-card {
            min-height: 76px;
            display: flex;
            align-items: center;
            padding: 13px 20px;

            background: rgba(255, 255, 255, 0.96);
            border: 2px solid #d71936;
            border-radius: 5px;

            color: #171717;
            text-decoration: none;

            box-shadow: none;

            transition:
                transform 0.18s ease,
                background-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        .language-card:hover {
            transform: translateY(-2px);
            background: #fff8f4;
            box-shadow: 0 5px 14px rgba(199, 16, 46, 0.10);
        }

        .language-card:active {
            transform: scale(0.985);
        }

        .flag {
            width: 43px;
            height: 31px;
            object-fit: contain;
            flex-shrink: 0;
            margin-right: 18px;
        }

        .language-name {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 21px;
            font-weight: 700;
            line-height: 1.1;
        }

        .arrow {
            margin-left: auto;
            padding-left: 14px;

            color: #d71936;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 29px;
            font-weight: 400;
            line-height: 1;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            width: 100%;
            max-width: 900px;
            margin-top: 48px;
            padding-bottom: 26px;
            text-align: center;
        }

        .footer-lines {
            position: relative;
            width: 100%;
            height: 30px;
            margin-bottom: 17px;
            overflow: hidden;
        }

        .footer-lines::before,
        .footer-lines::after {
            content: "";
            position: absolute;
            left: -5%;
            width: 110%;
            height: 13px;
            border-top: 3px solid #d71936;
            border-radius: 50%;
        }

        .footer-lines::before {
            top: 4px;
            transform: rotate(1.2deg);
        }

        .footer-lines::after {
            top: 12px;
            transform: rotate(-1deg);
        }

        .tagline {
            color: #c8102e;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(17px, 2.5vw, 23px);
            font-weight: 700;
            letter-spacing: 3px;
            line-height: 1.2;
            text-transform: uppercase;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .page {
                padding: 25px 14px 0;
            }

            .hero {
                padding: 7px 5px 27px;
            }

            .hero h1 {
                font-size: 45px;
                letter-spacing: 2px;
            }

            .hero p {
                margin-top: 13px;
                font-size: 20px;
                letter-spacing: 0.8px;
            }

            .languages {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .language-card {
                min-height: 67px;
                padding: 11px 15px;
            }

            .flag {
                width: 39px;
                height: 28px;
                margin-right: 15px;
            }

            .language-name {
                font-size: 20px;
            }

            .arrow {
                font-size: 27px;
            }

            .footer {
                margin-top: 37px;
                padding-bottom: 20px;
            }

            .tagline {
                font-size: 16px;
                letter-spacing: 2.2px;
            }
        }

        @media (max-width: 380px) {

            .hero h1 {
                font-size: 39px;
            }

            .hero p {
                font-size: 18px;
            }

            .language-name {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <!-- =========================
             TIGOTAN HEADER
        ========================== -->

        <header class="hero">
            <h1>TIGOTAN</h1>
            <p>VEGAN / GLUTEN FREE MENU</p>
        </header>


        <!-- =========================
             LANGUAGE SELECTION
        ========================== -->

        <section
            class="languages"
            aria-label="Choose your preferred language"
        >

            <!-- ENGLISH -->
            <a
                class="language-card"
                href="en/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="gb.svg"
                    alt="English"
                >
                <span class="language-name">English</span>
                <span class="arrow" aria-hidden="true">→</span>
            </a>


            <!-- ESPAÑOL -->
            <a
                class="language-card"
                href="es/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="es.svg"
                    alt="Español"
                >
                <span class="language-name">Español</span>
                <span class="arrow" aria-hidden="true">→</span>
            </a>


            <!-- FRANÇAIS -->
            <a
                class="language-card"
                href="fr/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="fr.svg"
                    alt="Français"
                >
                <span class="language-name">Français</span>
                <span class="arrow" aria-hidden="true">→</span>
            </a>


            <!-- ITALIANO -->
            <a
                class="language-card"
                href="it/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="it.svg"
                    alt="Italiano"
                >
                <span class="language-name">Italiano</span>
                <span class="arrow" aria-hidden="true">→</span>
            </a>


            <!-- DEUTSCH -->
            <a
                class="language-card"
                href="de/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="de.svg"
                    alt="Deutsch"
                >
                <span class="language-name">Deutsch</span>
                <span class="arrow" aria-hidden="true">→</span>
            </a>


            <!-- NEDERLANDS -->
            <a
                class="language-card"
                href="nl/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="nl.svg"
                    alt="Nederlands"
                >
                <span class="language-name">Nederlands</span>
                <span class="arrow" aria-hidden="true">→</span>
            </a>


            <!-- ÍSLENSKA -->
            <a
                class="language-card"
                href="is/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="is.svg"
                    alt="Íslenska"
                >
                <span class="language-name">Íslenska</span>
                <span class="arrow" aria-hidden="true">→</span>
            </a>


            <!-- SVENSKA -->
            <a
                class="language-card"
                href="sv/menu.pdf"
                target="_blank"
                rel="noopener"
            >
                <img
                    class="flag"
                    src="se.svg"
                    alt="Svenska"
                >
                <span class="language-name">Svenska</span>
                <span class="arrow" aria-hidden="true">→</span>
            </a>

        </section>


        <!-- =========================
             FOOTER / TAGLINE
        ========================== -->

        <footer class="footer">

            <div
                class="footer-lines"
                aria-hidden="true"
            ></div>

            <div class="tagline">
                YOU DINE, YOUR WAY
            </div>

        </footer>

    </main>

</body>
</html>
