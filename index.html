<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf7">
  <meta name="description" content="Tigotan Vegan & Gluten Free Menu — choose your preferred language.">
  <title>Tigotan | Vegan & Gluten Free Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="landing">
    <div class="paper-texture" aria-hidden="true"></div>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">TIGOTAN</p>
      <h1 id="page-title">SCAN OUR MENU</h1>
      <p class="diet">VEGAN / GLUTEN FREE</p>
      <p class="slogan">YOU DINE, YOUR WAY</p>
      <span class="divider" aria-hidden="true"></span>
    </section>

    <section class="language-section" aria-labelledby="language-title">
      <h2 id="language-title">Choose your preferred language</h2>
      <p class="intro">Discover our Vegan &amp; Gluten Free Menu<br>in your preferred language.</p>

      <nav class="language-grid" aria-label="Menu languages">
        <a class="language-card" href="/en/menu.pdf" target="_blank" rel="noopener" aria-label="Open menu in English">
          <img src="/gb.svg" alt="">
          <span>English</span><span class="arrow">→</span>
        </a>
        <a class="language-card" href="/es/menu.pdf" target="_blank" rel="noopener" aria-label="Abrir menú en Español">
          <img src="/es.svg" alt="">
          <span>Español</span><span class="arrow">→</span>
        </a>
        <a class="language-card" href="/fr/menu.pdf" target="_blank" rel="noopener" aria-label="Ouvrir le menu en Français">
          <img src="/fr.svg" alt="">
          <span>Français</span><span class="arrow">→</span>
        </a>
        <a class="language-card" href="/it/menu.pdf" target="_blank" rel="noopener" aria-label="Apri il menu in Italiano">
          <img src="/it.svg" alt="">
          <span>Italiano</span><span class="arrow">→</span>
        </a>
        <a class="language-card" href="/de/menu.pdf" target="_blank" rel="noopener" aria-label="Menü auf Deutsch öffnen">
          <img src="/de.svg" alt="">
          <span>Deutsch</span><span class="arrow">→</span>
        </a>
        <a class="language-card" href="/nl/menu.pdf" target="_blank" rel="noopener" aria-label="Open het menu in het Nederlands">
          <img src="/nl.svg" alt="">
          <span>Nederlands</span><span class="arrow">→</span>
        </a>
        <a class="language-card" href="/is/menu.pdf" target="_blank" rel="noopener" aria-label="Opna matseðil á Íslensku">
          <img src="/is.svg" alt="">
          <span>Íslenska</span><span class="arrow">→</span>
        </a>
        <a class="language-card" href="/sv/menu.pdf" target="_blank" rel="noopener" aria-label="Öppna menyn på Svenska">
          <img src="/se.svg" alt="">
          <span>Svenska</span><span class="arrow">→</span>
        </a>
      </nav>
    </section>

    <footer class="footer">
      <span class="wave" aria-hidden="true"></span>
      <p>YOU DINE, YOUR WAY</p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
